<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ScholarPrep – scholarship exam practice</title>
<style>
:root{--bg:#eef1f5;--fg:#11203b;--card:#fff;--ac:#1f4fd8;--mut:#5b6678;--ok:#13794a;--bad:#c8202f;--bd:#cfd6e2}
@media(prefers-color-scheme:dark){:root{--bg:#0e1626;--fg:#e8edf7;--card:#16213a;--ac:#7aa2ff;--mut:#98a4ba;--ok:#5fd39a;--bad:#ff7b88;--bd:#2c3a58}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,sans-serif}
h1,h2,h3{font-family:Georgia,serif;margin:.3em 0}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;padding:12px 20px;border-bottom:3px solid var(--ac)}
main{max-width:820px;margin:0 auto;padding:16px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:16px;margin:12px 0}
button,select,input{font:inherit;padding:9px 12px;border-radius:6px;border:1px solid var(--bd);background:var(--card);color:var(--fg)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button{cursor:pointer}.p{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}

.o{display:block;width:100%;text-align:left;margin:6px 0}

</style></head><body>
<header><b style="font-family:Georgia,serif;font-size:22px">ScholarPrep</b><span id="nav"></span></header><main id="app"></main>
<script>
const $=s=>document.querySelector(s),r=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,pk=a=>a[r(0,a.length-1)],sh=a=>a.map(x=>[Math.random(),x]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
const LS=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let U=null,Z=null;
const mc=(q,a,w)=>{a=String(a);w=[...new Set(w.map(String))].filter(x=>x!==a);return{q,a,o:sh([a,...sh(w).slice(0,3)])}};
const nw=n=>[n+1,n-1,n+10,n-10,n+2,n-2,n*2,n+5].filter(x=>x>=0&&x!==n);
const L=i=>String.fromCharCode(65+i%26);
/* ---------- question banks (original practice items, not official papers) ---------- */
const W=[['brave','courageous','cowardly',1],['happy','joyful','miserable',1],['big','enormous','tiny',1],['quick','rapid','slow',1],['begin','commence','finish',2],['help','assist','hinder',2],['smart','intelligent','foolish',2],['calm','serene','agitated',3],['generous','benevolent','stingy',3],['honest','truthful','deceitful',3],['diligent','industrious','lazy',4],['ancient','archaic','modern',4],['meagre','scant','abundant',5],['candid','frank','evasive',5],['scrutinise','examine','ignore',6],['obstinate','stubborn','flexible',6],['benign','harmless','harmful',6],['ephemeral','fleeting','permanent',7],['pragmatic','practical','idealistic',7],['reticent','reserved','talkative',7]];
const AN=[['hot','cold','up','down',1],['dog','puppy','cat','kitten',2],['pen','write','knife','cut',2],['bird','nest','bee','hive',3],['doctor','hospital','teacher','school',3],['finger','hand','toe','foot',3],['author','book','sculptor','statue',4],['thermometer','temperature','clock','time',4],['drought','water','famine','food',5],['whisper','shout','stroll','sprint',5],['novice','expert','amateur','professional',6],['frugal','miserly','thrifty','stingy',7]];
const RD=[[1,"Mia packed her torch, a map and two sandwiches before dawn. The path through the forest was muddy after the night's rain, so she walked slowly, watching each step.",[["Why did Mia walk slowly?","The path was muddy",["She was tired","She was lost","Her bag was heavy"],"Literal Comprehension"],["When did Mia most likely set out?","Very early in the morning",["At midday","In the late evening","In the afternoon"],"Inference"]]],
[3,"The lighthouse keeper had not spoken to another person in three weeks. When the supply boat finally appeared, he hurried down the rocky steps, rehearsing a greeting he feared he had forgotten how to say.",[["How did the keeper most likely feel about the boat's arrival?","Eager but slightly nervous",["Annoyed at being disturbed","Completely indifferent","Frightened of the sea"],"Inference"],["In this passage, “rehearsing” means","practising in advance",["forgetting","shouting","writing down"],"Vocabulary in Context"]]],
[5,"Urban beekeeping has grown rapidly in recent years. Supporters argue that city gardens and parks offer bees a surprisingly varied diet, while critics warn that too many hives may compete with native pollinators for limited food.",[["What concern do critics raise?","Hives may compete with native pollinators",["Bees cannot survive in cities","City honey is unsafe","Gardens are too small"],"Literal Comprehension"],["The tone of the passage is best described as","balanced and informative",["angry and accusatory","humorous and mocking","enthusiastic and one-sided"],"Tone & Purpose"]]],
[7,"Although the committee's report was lauded for its thoroughness, its recommendations were quietly shelved. Cynics suggested that the document had served its true purpose the moment it was commissioned: to demonstrate action without requiring any.",[["What do the cynics imply?","The report was mainly for show",["The report contained errors","The committee lacked expertise","The report was too short"],"Inference"],["“lauded” most nearly means","praised",["criticised","ignored","rewritten"],"Vocabulary in Context"]]]];
const SC=[["What is the powerhouse of the cell?","Mitochondria",["Nucleus","Ribosome","Chloroplast"],"Biology"],["Which gas do plants absorb for photosynthesis?","Carbon dioxide",["Oxygen","Nitrogen","Hydrogen"],"Biology"],["What is the chemical symbol for sodium?","Na",["So","S","Sd"],"Chemistry"],["A solution with a pH of 3 is","acidic",["neutral","basic","a salt"],"Chemistry"],["Which particle carries a negative charge?","Electron",["Proton","Neutron","Nucleus"],"Chemistry"],["Which unit measures force?","Newton",["Joule","Watt","Pascal"],"Physics"],["Speed is calculated as","distance ÷ time",["distance × time","time ÷ distance","mass ÷ volume"],"Physics"],["A reaction that releases heat is","exothermic",["endothermic","isothermal","catalytic"],"Physics"]];
const rd=t=>d=>{let c=RD.flatMap(p=>p[2].filter(x=>x[3]==t).map(x=>[p,x])),n=c.filter(([p])=>Math.abs(p[0]-d)<=2),[p,x]=pk(n.length?n:c);return mc(`<i>${p[1]}</i><br><br>${x[0]}`,x[1],x[2])};
const sc=t=>d=>{let x=pk(SC.filter(x=>x[3]==t));return mc(x[0],x[1],x[2])};
const $$=s=>x=>'$'+x;
/* ---------- generators: subject -> topic -> fn(difficulty 1-7) ---------- */
const G={
'Mathematics':{
Arithmetic:d=>{let a=r(2,5+d*2),b=r(2,12),c=r(10,40+d*20),n=a*b+c;return mc(`${a} × ${b} + ${c} = ?`,n,nw(n))},
Fractions:d=>{let k=pk([2,3,4,5,8,10]),n=r(1,k-1),b=k*r(2,4+d*2),x=b/k*n;return mc(`What is ${n}/${k} of ${b}?`,x,nw(x))},
Percentages:d=>{let p=pk([10,20,25,50,5,15,30,40]),n=20*r(2,4+d*3);if(d>3&&r(0,1)){let x=n-n*p/100;return mc(`A $${n} jacket is discounted by ${p}%. What is the sale price?`,'$'+x,nw(x).map($$()))}let x=n*p/100;return mc(`What is ${p}% of ${n}?`,x,nw(x))},
Algebra:d=>{let x=r(2,8+d),a=r(2,3+d),b=r(1,20);return mc(d<3?`? + ${b} = ${x+b}. What is ?`:`${a}x + ${b} = ${a*x+b}. What is x?`,x,nw(x))},
Geometry:d=>{let w=r(3,6+d*2),l=r(w+1,w+8),t=r(0,2);if(t==0)return mc(`A rectangle is ${l} cm by ${w} cm. What is its perimeter?`,2*(l+w)+' cm',[l*w,l+w,2*l+w,4*l].map(v=>v+' cm'));if(t==1)return mc(`What is the area of a rectangle ${l} cm by ${w} cm?`,l*w+' cm²',[2*(l+w),l+w,l*w+l,l*w-w].map(v=>v+' cm²'));let b=2*r(2,5+d),h=r(3,9);return mc(`A triangle has base ${b} cm and height ${h} cm. What is its area?`,b*h/2+' cm²',[b*h,b+h,b*h/2+h,b*h/2-1].map(v=>v+' cm²'))},
Ratios:d=>{let a=r(1,4),b=r(a+1,6),k=r(2,3+d),t=k*(a+b),x=k*a;return mc(`Red and blue counters are in the ratio ${a}:${b}. There are ${t} counters in total. How many are red?`,x,[k*b,t-a,x+k,k].concat(nw(x)))}},
'Quantitative Reasoning':{
'Word Problems':d=>{if(r(0,1)){let s=r(40,60+d*10),h=r(2,4+d%3);return mc(`A train travels at ${s} km/h for ${h} hours. How far does it go?`,s*h+' km',nw(s*h).map(v=>v+' km'))}let n=r(2,5),p=r(3,9)+d,m=n*p+r(1,15),x=m-n*p;return mc(`${n} books cost $${p} each. Zoe pays with $${m}. How much change does she get?`,'$'+x,nw(x).map($$()))},
Averages:d=>{let m=r(10,14+d*3),a=r(m-3,m+3),b=r(m-3,m+3),c=r(m-3,m+3),x=4*m-a-b-c;return mc(`The mean of four numbers is ${m}. Three of them are ${a}, ${b} and ${c}. What is the fourth?`,x,nw(x))},
'Number Puzzles':d=>{let x=r(3,12+d),a=r(2,4),b=r(1,15);return mc(`I think of a number, multiply it by ${a}, then add ${b}. The result is ${a*x+b}. What was my number?`,x,nw(x))}},
'Pattern Reasoning':{
'Number Sequences':d=>{let t=d<3?0:r(0,2),s=r(1,9),st=r(2,4+d),q=[],a;if(t==0){q=[0,1,2,3].map(i=>s+i*st);a=s+4*st}else if(t==1){let f=r(1,3);q=[s];for(let i=0;i<4;i++)q.push(q[i]+f+i);a=q[4]+f+4}else{let m=r(2,3);q=[0,1,2,3].map(i=>Math.min(s,4)*m**i);a=Math.min(s,4)*m**4}return mc(`What comes next? ${q.join(', ')}, ?`,a,nw(a).concat([a+st,a-st]))},
'Letter Patterns':d=>{let st=r(1,3+(d>4?2:0)),s=r(0,5),q=[0,1,2,3].map(i=>L(s+i*st)),a=s+4*st;return mc(`What letter comes next? ${q.join(', ')}, ?`,L(a),[L(a+1),L(a-1),L(a+2),L(a+st+1)])}},
'Verbal Reasoning':{
Synonyms:d=>{let c=W.filter(w=>Math.abs(w[3]-d)<=1),w=pk(c.length?c:W);return mc(`Choose the word closest in meaning to “${w[0]}”.`,w[1],W.filter(x=>x!=w).map(x=>x[2]))},
Antonyms:d=>{let c=W.filter(w=>Math.abs(w[3]-d)<=1),w=pk(c.length?c:W);return mc(`Choose the word most opposite in meaning to “${w[0]}”.`,w[2],W.filter(x=>x!=w).map(x=>x[1]))},
Analogies:d=>{let c=AN.filter(a=>Math.abs(a[4]-d)<=1),a=pk(c.length?c:AN);return mc(`${a[0]} is to ${a[1]} as ${a[2]} is to …?`,a[3],AN.filter(x=>x!=a).map(x=>x[3]))}},
'Reading Comprehension':{'Literal Comprehension':rd('Literal Comprehension'),Inference:rd('Inference'),'Vocabulary in Context':rd('Vocabulary in Context'),'Tone & Purpose':rd('Tone & Purpose')},
'Science':{Biology:sc('Biology'),Chemistry:sc('Chemistry'),Physics:sc('Physics')}};
/* ---------- exam formats and year-level subjects ---------- */
const SUB={'Mathematics':[4,10],'Quantitative Reasoning':[5,10],'Verbal Reasoning':[4,10],'Reading Comprehension':[4,10],'Pattern Reasoning':[4,10],'Science':[8,10]};
const EX={ACER:{s:['Mathematics','Reading Comprehension','Quantitative Reasoning','Pattern Reasoning'],n:15,m:20},Edutest:{s:['Reading Comprehension','Mathematics','Verbal Reasoning','Quantitative Reasoning','Pattern Reasoning'],n:15,m:20},'Other (general / school-specific)':{s:Object.keys(SUB),n:12,m:15}};
const subjFor=(e,y)=>EX[e].s.filter(s=>SUB[s][0]<=y&&y<=SUB[s][1]);
/* ---------- accounts: Supabase (paste your two values here) ---------- */
const SB_URL='https://ukjnhyumzsazdkqpvpqp.supabase.co/rest/v1/',SB_KEY='sb_publishable_yyWm1l1uhdzRK4XHDsxfmg_1-JilPL-';
let S=LS('sp_sess'),RES=[],IS_ADMIN=false,AD=null;
async function sb(path,o={},retry=1){let h={apikey:SB_KEY,'Content-Type':'application/json',...(o.h||{})};if(S&&!o.noauth)h.Authorization='Bearer '+S.access_token;
let x;try{x=await fetch(SB_URL+path,{method:o.m||'GET',headers:h,body:o.b?JSON.stringify(o.b):undefined})}catch(e){throw new Error('Could not reach '+SB_URL+path.split('?')[0]+' ('+e.message+'). Check SB_URL, or turn off Brave Shields / content blockers for this site.')}
if(x.status==401&&S&&retry&&!o.noauth&&await refresh())return sb(path,o,0);
let j=null;try{j=await x.json()}catch(e){}
if(!x.ok)throw new Error((j&&(j.msg||j.error_description||j.message||j.error))||'Request failed ('+x.status+')');return j}
async function refresh(){try{keep(await sb('/auth/v1/token?grant_type=refresh_token',{m:'POST',b:{refresh_token:S.refresh_token},noauth:1}));return 1}catch(e){S=null;localStorage.removeItem('sp_sess');return 0}}
function keep(j){S={access_token:j.access_token,refresh_token:j.refresh_token,uid:j.user.id,email:j.user.email};SV('sp_sess',S)}
async function enter(){U=S.email;RES=(await sb('/rest/v1/results?select=created_at,ex,y,md,q&order=created_at.asc&user_id=eq.'+S.uid)).map(a=>({d:new Date(a.created_at).toLocaleString(),ex:a.ex,y:a.y,md:a.md,q:a.q}));try{IS_ADMIN=(await sb('/rest/v1/admins?select=user_id')).length>0}catch(e){IS_ADMIN=false}home()}
function nav(){$('#nav').innerHTML=U?`${U} <button onclick=home()>Train</button> <button onclick=prog()>Progress</button> ${IS_ADMIN?'<button onclick=adminView()>Admin</button> ':''}<button onclick=out()>Log out</button>`:''}
function authView(msg=''){if(SB_URL.startsWith('PASTE'))return $('#app').innerHTML='<div class=c><h2>Setup needed</h2><p>Add your Supabase project URL and anon key near the top of the script in index.html, then reload.</p></div>';
$('#app').innerHTML=`<div class=c><h2>Log in or create a profile</h2><p class=m>Your results are saved to your account and follow you to any device.</p>${msg?`<p style="color:var(--bad)">${msg}</p>`:''}<label>Email<br><input id=u type=email autocomplete=email></label><label>Password<br><input id=pw type=password autocomplete=current-password></label><br><button class=p onclick=auth(0)>Log in</button> <button onclick=auth(1)>Create profile</button></div>`}
async function auth(reg){let u=$('#u').value.trim(),p=$('#pw').value;if(!u.includes('@')||p.length<6)return authView('Enter a valid email and a password of 6+ characters.');
try{if(reg){let j=await sb('/auth/v1/signup',{m:'POST',b:{email:u,password:p},noauth:1});if(!j.access_token)return authView('Profile created. Check your email to confirm it, then log in.');keep(j)}else keep(await sb('/auth/v1/token?grant_type=password',{m:'POST',b:{email:u,password:p},noauth:1}));await enter()}catch(e){authView(e.message)}}
function out(){S=null;U=null;RES=[];IS_ADMIN=false;AD=null;localStorage.removeItem('sp_sess');nav();authView()}
/* ---------- stats and honest feedback ---------- */
function stats(res){let m={};res.forEach(a=>a.q.forEach(([s,t,ok])=>{let k=s+'|'+t;m[k]=m[k]||[0,0];m[k][1]++;m[k][0]+=ok}));return m}
function truth(m,min){let A=Object.values(m).reduce((a,v)=>[a[0]+v[0],a[1]+v[1]],[0,0]);if(!A[1])return'<p class=m>No data yet. Answer some questions to get an honest assessment.</p>';
let o=Math.round(A[0]/A[1]*100),v=o<50?'You are not ready. At this accuracy you would not be competitive for a scholarship.':o<70?'You are below scholarship standard. You will lose a lot of marks unless the weak areas below are fixed.':o<85?'You are close but inconsistent. Scholarship exams reward reliability, not occasional brilliance.':'Your accuracy is strong. Keep proving it under timed conditions.';
let T=Object.entries(m).filter(([k,x])=>x[1]>=min).map(([k,x])=>[k.split('|'),Math.round(x[0]/x[1]*100),x[1]]).sort((a,b)=>a[1]-b[1]);
return`<p><b>${o}% overall (${A[0]}/${A[1]}).</b> ${v}</p>`+(T.length?T.map(([[s,t],p,n])=>`<div class="t ${p<40?'b':p<60?'b':p<80?'w':'g2'}"><b>${t}</b> <small>${s}</small>: ${p}% over ${n} questions. ${p<40?'This is a serious weakness. You do not understand it yet and it will cost you marks in every paper.':p<60?'Below the standard you need. You are right about as often as you are wrong, which means you are partly guessing.':p<80?'Inconsistent. You know it, but not reliably enough for exam conditions.':'Solid.'}</div>`).join(''):`<p class=m>Too few questions per topic for topic-level conclusions. Check My progress after more sessions.</p>`)}
/* ---------- setup ---------- */
function home(){nav();$('#app').innerHTML=`<div class=c><h2>Set up a session</h2><div class=g>
<label>Exam<select id=ex onchange=subs(1)>${Object.keys(EX).map(e=>`<option>${e}`).join('')}</select></label>
<label>Year level<select id=y onchange=subs()>${[4,5,6,7,8,9,10].map(y=>`<option value=${y}>Year ${y}`).join('')}</select></label>
<label>Mode<select id=md onchange=subs()><option value=p>Practice (instant feedback)<option value=t>Targeted (aimed at my weak spots)<option value=e>Exam mode (timed, no feedback)</select></label>
<label>Questions per subject<input id=n type=number min=3 max=40></label></div><div id=ep></div><h3>Subjects</h3><div id=sb></div><br><button class=p onclick=start()>Start</button></div>
<p class=m><small>Practice questions are original and modelled on common scholarship formats. They are not official ACER or Edutest papers, and exam lengths are approximate.</small></p>`;subs(1)}
function subs(f){let ex=$('#ex').value,y=+$('#y').value,md=$('#md').value,l=subjFor(ex,y);if(f||!$('#n').value)$('#n').value=EX[ex].n;
if(md!='e')$('#ep').innerHTML='';else if(!$('#sc'))$('#ep').innerHTML=`<label>Exam format<select id=sc onchange=subs()><option value=one>One subject<option value=all>Full exam (a heading for each subject section)</select></label>`;
let sc=md=='e'&&$('#sc').value;
$('#sb').innerHTML=md!='e'?l.map(s=>`<label><input type=checkbox class=sb value="${s}" checked>${s}</label>`).join(''):sc=='one'?`<select id=one>${l.map(s=>`<option>${s}`).join('')}</select>`:l.map((s,i)=>`<div>Section ${i+1}: ${s}</div>`).join('')}
/* ---------- build and run ---------- */
function wt(s,m){let T=Object.keys(G[s]),w=T.map(t=>{let v=m[s+'|'+t];return v&&v[1]?1.05-v[0]/v[1]:.6}),x=Math.random()*w.reduce((a,b)=>a+b),i=0;while(i<T.length-1&&x>w[i]){x-=w[i];i++}return T[i]}
function start(){let ex=$('#ex').value,y=+$('#y').value,md=$('#md').value,n=Math.max(3,Math.min(40,+$('#n').value||10)),l=subjFor(ex,y),sc=md=='e'&&$('#sc').value,sel;
if(md=='e')sel=sc=='one'?[$('#one').value]:l;else sel=[...document.querySelectorAll('.sb:checked')].map(x=>x.value);
if(!sel.length)return alert('Pick at least one subject.');
let m=stats(RES),d=Math.min(7,y-3),Q=[];
sel.forEach(s=>{let seen=new Set;for(let i=0;i<n;i++){let t=md=='t'?wt(s,m):pk(Object.keys(G[s])),x,k=0;do{x=G[s][t](d);k++}while(seen.has(x.q)&&k<12);seen.add(x.q);Q.push({...x,s,t})}});
if(md!='e')Q=sh(Q);
Z={Q,i:0,md,ex,y,A:[],secs:Math.round(sel.length*EX[ex].m*60*n/EX[ex].n)};md=='e'?examView():qView()}
function qView(){let q=Z.Q[Z.i];$('#app').innerHTML=`<div class=c><small>${q.s}: ${q.t}. Question ${Z.i+1} of ${Z.Q.length}</small><div class=bar><i style="width:${Z.i/Z.Q.length*100}%"></i></div><p style="font-size:18px">${q.q}</p>${q.o.map((o,j)=>`<button class=o onclick=ans(${j})>${o}</button>`).join('')}<div id=fb></div></div>`}
function ans(j){let q=Z.Q[Z.i];if(Z.A[Z.i]!=null)return;Z.A[Z.i]=j;document.querySelectorAll('.o').forEach((b,k)=>{b.disabled=true;if(q.o[k]==q.a)b.classList.add('ok');else if(k==j)b.classList.add('no')});$('#fb').innerHTML=`<p><b>${q.o[j]==q.a?'Correct.':'Wrong. The answer is '+q.a+'.'}</b></p><button class=p onclick=nx()>${Z.i+1<Z.Q.length?'Next question':'Finish'}</button>`}
function nx(){Z.i++;Z.i<Z.Q.length?qView():fin()}
function examView(){let h='',last='',k=0;Z.Q.forEach((q,i)=>{if(q.s!=last){last=q.s;k++;h+=`<h2 class=sec>Section ${k}: ${q.s}</h2>`}h+=`<div class=c><b>${i+1}.</b> ${q.q}${q.o.map((o,j)=>`<label><input type=radio name=q${i} value=${j}>${o}</label>`).join('')}</div>`});
$('#app').innerHTML=`<h1>${Z.ex} exam, Year ${Z.y}</h1><div id=tm></div>${h}<button class=p onclick=fin()>Submit exam</button>`;
let end=Date.now()+Z.secs*1000;Z.iv=setInterval(()=>{let s=Math.max(0,Math.round((end-Date.now())/1000));$('#tm').textContent='Time left: '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0');if(!s)fin()},500)}
function fin(){if(Z.done)return;Z.done=1;clearInterval(Z.iv);
if(Z.md=='e')Z.Q.forEach((q,i)=>{let c=document.querySelector(`input[name=q${i}]:checked`);Z.A[i]=c?+c.value:null});
let rec=Z.Q.map((q,i)=>[q.s,q.t,+(Z.A[i]!=null&&q.o[Z.A[i]]==q.a)]);
RES.push({d:new Date().toLocaleString(),ex:Z.ex,y:Z.y,md:Z.md,q:rec});sb('/rest/v1/results',{m:'POST',b:{ex:Z.ex,y:Z.y,md:Z.md,q:rec},h:{Prefer:'return=minimal'}}).catch(e=>alert('This result could not be saved to your account: '+e.message));
let ok=rec.reduce((a,x)=>a+x[2],0),bad=Z.Q.map((q,i)=>rec[i][2]?'':`<div class=t><p>${q.q}</p>Your answer: <b style="color:var(--bad)">${Z.A[i]==null?'(none)':q.o[Z.A[i]]}</b><br>Correct: <b style="color:var(--ok)">${q.a}</b></div>`).join('');
window.scrollTo(0,0);$('#app').innerHTML=`<div class=c><h2>${ok} / ${rec.length} (${Math.round(ok/rec.length*100)}%)</h2><h3>The plain truth about this attempt</h3>${truth(stats([{q:rec}]),2)}</div><div class=c><h3>Questions you got wrong</h3>${bad||'<p>None. Every answer was correct.</p>'}</div><button class=p onclick=home()>New session</button> <button onclick=prog()>My progress</button>`}
/* ---------- progress ---------- */
function prog(){nav();let R=RES,m=stats(R),rows=Object.entries(m).sort().map(([k,v])=>{let[s,t]=k.split('|'),p=Math.round(v[0]/v[1]*100);return`<tr><td>${s}<td>${t}<td>${v[1]}<td style="width:28%"><div class=bar><i style="width:${p}%"></i></div><td>${p}%`}).join('');
$('#app').innerHTML=`<div class=c><h2>My progress</h2><h3>The plain truth</h3>${truth(m,3)}</div>${R.length?`<div class=c><h3>Every topic</h3><div style="overflow-x:auto"><table><tr><th>Subject<th>Topic<th>Qs<th><th>Accuracy${rows}</table></div></div><div class=c><h3>Recent sessions</h3>${R.slice().reverse().slice(0,30).map(a=>`<p>${a.d}. ${a.ex}, Year ${a.y}, ${{p:'Practice',t:'Targeted',e:'Exam'}[a.md]}: ${a.q.reduce((x,y)=>x+y[2],0)}/${a.q.length}</p>`).join('')}</div>`:''}<div class=c><small>Results are saved to your account and follow you across devices.</small><br><br><button onclick=wipe()>Reset my results</button></div>`}
function wipe(){if(confirm('Delete all of your results?')){sb('/rest/v1/results?user_id=eq.'+S.uid,{m:'DELETE'}).then(()=>{RES=[];prog()}).catch(e=>alert(e.message))}}
/* ---------- admin (read-only; enforced by database rules, not by this page) ---------- */
const tbl=m=>'<div style="overflow-x:auto"><table><tr><th>Subject<th>Topic<th>Qs<th><th>Accuracy'+Object.entries(m).sort().map(([k,v])=>{let[s,t]=k.split('|'),p=Math.round(v[0]/v[1]*100);return`<tr><td>${s}<td>${t}<td>${v[1]}<td style="width:28%"><div class=bar><i style="width:${p}%"></i></div><td>${p}%`}).join('')+'</table></div>';
const sess=R=>R.map(a=>`<p>${a.d}. ${a.ex}, Year ${a.y}, ${{p:'Practice',t:'Targeted',e:'Exam'}[a.md]}: ${a.q.reduce((x,y)=>x+y[2],0)}/${a.q.length}</p>`).join('');
async function adminView(id){nav();$('#app').innerHTML='<p class=m>Loading…</p>';
try{if(!AD)AD=await Promise.all([sb('/rest/v1/profiles?select=id,email,created_at&order=created_at.asc'),sb('/rest/v1/results?select=user_id,created_at,ex,y,md,q&order=created_at.desc&limit=1000')]);
let[P,R]=AD,cv=a=>({d:new Date(a.created_at).toLocaleString(),ex:a.ex,y:a.y,md:a.md,q:a.q});
if(id){let p=P.find(x=>x.id==id),rs=R.filter(a=>a.user_id==id).map(cv),m=stats(rs);return $('#app').innerHTML=`<button onclick=adminView()>Back to all students</button><div class=c><h2>${p?p.email:'Unknown student'}</h2><h3>The plain truth</h3>${truth(m,3)}</div>${rs.length?`<div class=c><h3>Every topic</h3>${tbl(m)}</div><div class=c><h3>All sessions, newest first</h3>${sess(rs)}</div>`:''}`}
let T=R.reduce((a,x)=>a+x.q.length,0);
$('#app').innerHTML=`<div class=c><h2>Admin: all students</h2><p class=m>${P.length} accounts, ${R.length} sessions, ${T} questions answered. Shows the 1000 most recent sessions.</p><button onclick="AD=null;adminView()">Refresh</button><div style="overflow-x:auto"><table><tr><th>Email<th>Joined<th>Sessions<th>Questions<th>Accuracy<th>Last active${P.map(p=>{let rs=R.filter(a=>a.user_id==p.id),n=rs.reduce((a,x)=>a+x.q.length,0),ok=rs.reduce((a,x)=>a+x.q.reduce((b,y)=>b+y[2],0),0);return`<tr><td><a href=# onclick="adminView('${p.id}');return false">${p.email}</a><td>${new Date(p.created_at).toLocaleDateString()}<td>${rs.length}<td>${n}<td>${n?Math.round(ok/n*100)+'%':'-'}<td>${rs.length?new Date(rs[0].created_at).toLocaleDateString():'-'}`}).join('')}</table></div></div>`}catch(e){$('#app').innerHTML='<div class=c>Could not load admin data: '+e.message+'</div>'}}
if(S)enter().catch(()=>{U=null;nav();authView()});else authView()
</script></body></html>
